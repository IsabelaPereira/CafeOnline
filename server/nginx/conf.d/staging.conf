# HTTP → HTTPS
server {
    listen 80;
    server_name staging.dasmatas.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Staging
server {
    listen 443 ssl;
    server_name staging.dasmatas.com.br;

    ssl_certificate     /etc/letsencrypt/live/staging.dasmatas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.dasmatas.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/staging;
    index index.html;

    # Assets com hash — cache agressivo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(ico|jpg|jpeg|png|gif|webp|svg|woff|woff2|ttf|eot|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proteger staging com senha (descomente para ativar)
    # auth_basic "Staging — Das Matas";
    # auth_basic_user_file /etc/nginx/conf.d/.htpasswd;
}
