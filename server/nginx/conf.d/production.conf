# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name dasmatas.com.br www.dasmatas.com.br;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.dasmatas.com.br$request_uri;
    }
}

# Redireciona domínio sem www → com www
server {
    listen 443 ssl;
    server_name dasmatas.com.br;

    ssl_certificate     /etc/letsencrypt/live/dasmatas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dasmatas.com.br/privkey.pem;

    return 301 https://www.dasmatas.com.br$request_uri;
}

# Site principal
server {
    listen 443 ssl;
    server_name www.dasmatas.com.br;

    ssl_certificate     /etc/letsencrypt/live/dasmatas.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dasmatas.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/production;
    index index.html;

    # Assets com hash do Vite — cache agressivo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Imagens e fontes
    location ~* \.(ico|jpg|jpeg|png|gif|webp|svg|woff|woff2|ttf|eot|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloquear dotfiles
    location ~ /\. {
        deny all;
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
